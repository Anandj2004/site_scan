<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Department</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    h2 {
      color: #333;
      font-size: 30px;
      margin-bottom: 25px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin-top: 30px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      padding: 15px;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card:hover {
      transform: scale(1.05);
      background: #eef6ff;
    }
    .card img {
      width: 100%;
      height: 230px;   /* bigger height */
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    p {
      font-size: 20px;   /* slightly bigger text */
      font-weight: bold;
      margin: 0;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <h2>🚀 Choose Department</h2>
  <div class="grid">
    <div class="card" onclick="selectDept('Electricity')">
      <img src="https://coboelectric.ca/wp-content/uploads/2020/10/AdobeStock_275162542.jpeg" alt="Electricity">
      <p>Electricity</p>
    </div>
    <div class="card" onclick="selectDept('Water')">
      <img src="https://hls.harvard.edu/wp-content/uploads/2023/09/water-crisis-in-Dehli-tanker-collection-GettyImages-1241338599-2400x1600-1-800x1180.jpg" alt="Water">
      <p>Water</p>
    </div>
    <div class="card" onclick="selectDept('Roads')">
      <img src="https://assets.thehansindia.com/h-upload/2022/12/04/1323283-roads.webp" alt="Roads">
      <p>Roads</p>
    </div>
    <div class="card" onclick="selectDept('Drainage')">
      <img src="https://media.npr.org/assets/img/2017/06/07/india-pollution_custom-36fb50c6e26e115c6306aa95d9d9027cae8da90f.jpg" alt="Drainage">
      <p>Drainage</p>
    </div>
    <div class="card" onclick="selectDept('Other')">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTeJt1cHfnW_VPocnF-SNkt_o7lKT0oZlBbEGPZn50lYw&s=10" alt="Other">
      <p>Other</p>
    </div>
  </div>

  <script>
    // check if already complaint submitted
    window.onload = function () {
      const submitted = localStorage.getItem("complaintSubmitted");
      if (submitted) {
        window.location.href = "status.html"; 
      }
    }

    function selectDept(dept) {
      localStorage.setItem('department', dept);
      window.location.href = "form.html"; 
    }
  </script>
</body>
</html>
